<head>

</head>
<body>

<label for="username">Username</label>

<!--password input-->
<label for="password">Password</label>
<input type="password" id="password" name="password" required>
<br><br>
<!--Radio button for gender-->
<label>Gender:</label>

<label for="male">Male</label>

    </form>
    
</body>
